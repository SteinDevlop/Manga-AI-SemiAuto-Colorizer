[project]
name = "manga-colorizer-backend"
version = "0.1.0"
description = "Backend FastAPI monolito modular para Manga Colorizer"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "greenlet==3.5.6",
    "psycopg2-binary==2.9.13",
    "celery==5.7.0",
    "redis==8.1.0",
    "cryptography==50.0.2",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
    "Pillow==13.0.0",
    "numpy==2.4.6",
    "opencv-python-headless==5.1.0.95",
    "filetype==1.2.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "ruff==0.17.6",
    "mypy==2.4.1",
]
# Inferencia de modelos registrados (.pt / .onnx). torch se instala aparte en Docker (índice CPU).
ml = [
    "torch>=2.3",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B017", "F821", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "name-defined", "return-value", "valid-type", "arg-type", "union-attr", "no-any-return", "import-untyped"]
