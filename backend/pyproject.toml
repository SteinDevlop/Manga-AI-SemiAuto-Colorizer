[project]
name = "manga-colorizer-backend"
version = "0.1.0"
description = "Backend FastAPI monolito modular para Manga Colorizer"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "celery==5.7.0",
    "redis==8.1.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "asyncpg==0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B017", "F821", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["attr-defined", "name-defined", "return-value", "valid-type", "arg-type", "union-attr", "no-any-return", "import-untyped"]
