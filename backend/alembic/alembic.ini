# Alembic configuration file for Manga Colorizer backend

[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by environment variable DATABASE_URL if set)
# Alembic uses psycopg2 (synchronous driver); the app uses asyncpg at runtime.
sqlalchemy.url = postgresql+psycopg2://manga:manga_password@postgres:5432/manga_colorizer

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "version code" format
# max_version_code_length = 32

# the format string used to generate version codes
# version_code_format = {version}_{slug}

# the version code separator
# version_code_separator = _

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
